# Task 1.1.2: build and run the test suite on every push to main and every PR.
#
# Runner: macos-26. The test targets deploy to iOS 26.4, and macos-15 carries at
# most Xcode 26.3 with iOS 26.2 simulators, so the suite cannot build there.
#
# Simulator: an iPhone 17 on the newest installed iOS runtime, picked from
# `simctl` rather than named in the destination. macos-26 has no "iPhone 16",
# and `OS=latest` fails outright when the newest SDK has no runtime installed.
#
# Real audio engine: hosted runners have no usable audio route. Tests that build
# a real AVAudioEngine can abort the test process there (AURemoteIO RPC timeout
# on release) and stall every other test while they wait, so the phone job sets
# TEST_RUNNER_STABILYZ_SKIP_REAL_AUDIO_ENGINE_TESTS=1 and those tests, and only
# those, are skipped. They still run in every local run. The reasoning and the
# guard that keeps the list exact are in
# Stabilyz/StabilyzTests/RealAudioEngineTrait.swift.
#
# Wall clock: the suite's tests run concurrently on the runner's three cores, so
# a test that asserts a real-time limit cannot hold there. The phone job sets
# TEST_RUNNER_STABILYZ_SKIP_WALL_CLOCK_TESTS=1 and the tests marked
# .wallClockSensitive, and only those, are skipped. See
# Stabilyz/StabilyzTests/WallClockSensitiveTrait.swift; the list of such tests
# is pinned by RealAudioEngineGuardTests.
#
# Watch: a second job builds the watch app and runs its unit and UI tests on a
# watch simulator. It is a separate job so it cannot slow or fail the phone job.
# The watch test targets deploy to watchOS 27.0 in the project, and this runner
# carries Xcode 26.x with watch simulators up to 26.x. So the job passes
# WATCHOS_DEPLOYMENT_TARGET on the command line, set to the newest watchOS
# runtime installed: a CI-only override that leaves the project untouched. The
# watch app itself deploys to watchOS 10, so nothing it ships changes. Remove
# the override once the test targets' deployment target is lowered in Xcode or
# the runner carries a watchOS 27 simulator.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the latest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator
        id: simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          wanted = "iPhone 17"
          minimum = (26, 4)
          runtimes = []
          for key, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              if match and devices:
                  runtimes.append(((int(match.group(1)), int(match.group(2))), devices))
          runtimes = [r for r in runtimes if r[0] >= minimum]
          if not runtimes:
              sys.exit("no iOS " + ".".join(map(str, minimum)) + "+ simulator runtime is installed")
          version, devices = max(runtimes, key=lambda r: r[0])
          phones = [d for d in devices if d["name"].startswith("iPhone")]
          chosen = next((d for d in phones if d["name"] == wanted), phones[0] if phones else None)
          if chosen is None:
              sys.exit("no iPhone simulator on iOS " + ".".join(map(str, version)))
          print(chosen["name"], ".".join(map(str, version)), file=sys.stderr)
          print(chosen["udid"])
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          # xcodebuild strips TEST_RUNNER_ and passes the rest to the test
          # process. Skips only the tests marked .requiresRealAudioEngine.
          TEST_RUNNER_STABILYZ_SKIP_REAL_AUDIO_ENGINE_TESTS: "1"
          # Skips only the tests marked .wallClockSensitive (see the header).
          TEST_RUNNER_STABILYZ_SKIP_WALL_CLOCK_TESTS: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stabilyz/Stabilyz.xcodeproj \
            -scheme Stabilyz \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  test-watch:
    name: Build and test (watch)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a watch simulator
        id: simulator
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = []
          for key, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"watchOS-(\d+)-(\d+)", key)
              watches = [d for d in devices if d["name"].startswith("Apple Watch")]
              if match and watches:
                  runtimes.append(((int(match.group(1)), int(match.group(2))), watches))
          if not runtimes:
              sys.exit("no watchOS simulator runtime with an Apple Watch device is installed")
          version, watches = max(runtimes, key=lambda r: r[0])
          chosen = watches[0]
          print(chosen["name"], ".".join(map(str, version)), file=sys.stderr)
          print(chosen["udid"], ".".join(map(str, version)))
          ')"
          echo "udid=${UDID%% *}" >> "$GITHUB_OUTPUT"
          echo "version=${UDID##* }" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stabilyz/Stabilyz.xcodeproj \
            -scheme "StabilyzWatch Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath WatchTestResults.xcresult \
            WATCHOS_DEPLOYMENT_TARGET="${{ steps.simulator.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WatchTestResults
          path: WatchTestResults.xcresult
          retention-days: 7
